<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plans &amp; Pricing · EcoCrete</title>
  <meta name="description" content="Monthly EcoCrete workspaces for contractors: Starter, Professional and Enterprise, excluding 12% VAT." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/plans.js"></script>
</head>

<body>
  <div id="header"></div>

  <main>
    <section class="hero page-hero">
      <div class="container">
        <div class="hero-badge">Month to month · cancel any time</div>
        <h1 class="hero-title">Plans that scale with <span>your pours</span></h1>
        <p class="hero-desc" style="margin-bottom:0">Every workspace keeps your estimates, batching sheets, supplier
          prices and test results in one place. Prices exclude 12% VAT.</p>
      </div>
    </section>

    <section class="section" style="padding-top:32px">
      <div class="container">
        <div class="pricing-grid" id="plans-grid"></div>

        <div class="section-head" style="margin-top:24px">
          <h2 data-words>Compare plans</h2>
        </div>
        <div class="table-wrap">
          <table class="data-table compare" id="compare"></table>
        </div>

        <div class="section-head" style="margin-top:40px">
          <h2 data-words>FAQ</h2>
        </div>
        <div class="faq" id="faq"></div>

        <div class="btn-row" style="margin-top:32px">
          <button class="btn btn-primary" data-upgrade>Pay by bank transfer</button>
          <a href="services.html" class="btn btn-outline">One-off services</a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>
</body>

</html>
